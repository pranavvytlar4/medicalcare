<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create your account</title>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="signup-wrapper">
    <main class="signup-main">
      <section class="signup-section">

        <!-- Left Column: Signup Card -->
        <div class="signup-card">
          <!-- Logo & Header -->
          <div class="signup-header">
            <button type="button" class="logo-button" aria-label="Home">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5z" />
                <path d="M2 17l10 5 10-5" />
                <path d="M2 12l10 5 10-5" />
              </svg>
            </button>
            <div class="header-text">
              <h1 class="signup-title">Create your account</h1>
              <p class="signup-subtitle">Get started in just a few steps.</p>
            </div>
          </div>

          <!-- Social Login Buttons -->
          <div class="social-buttons">
            <!-- Google -->
            <button type="button" class="social-button" id="googleBtn" aria-label="Sign up with Google" title="Sign up with Google">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
              </svg>
            </button>

            <!-- Apple -->
            <button type="button" class="social-button" id="appleBtn" aria-label="Sign up with Apple" title="Sign up with Apple">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 1.01-2.85-.92.04-2.03.62-2.69 1.38-.57.65-1.07 1.7-1.01 2.72 1.03.08 2.07-.5 2.69-1.25z"/>
              </svg>
            </button>

            <!-- GitHub -->
            <button type="button" class="social-button" id="githubBtn" aria-label="Sign up with GitHub" title="Sign up with GitHub">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
              </svg>
            </button>
          </div>

          <!-- Divider -->
          <div class="divider">
            <span>or with</span>
          </div>

          <!-- Status / Feedback Message Box -->
          <div class="form-feedback" id="formFeedback" role="alert"></div>

          <!-- Signup Form -->
          <form class="signup-form" id="signupForm" novalidate>
            <!-- Full Name -->
            <div class="form-field">
              <label for="name">
                Full Name <span class="required">*</span>
              </label>
              <input 
                type="text" 
                id="name" 
                name="name" 
                placeholder="Diar Muradi" 
                required 
                autocomplete="name"
              >
              <span class="field-error" id="nameError"></span>
            </div>

            <!-- Email -->
            <div class="form-field">
              <label for="email">
                Email <span class="required">*</span>
              </label>
              <input 
                type="email" 
                id="email" 
                name="email" 
                placeholder="contact@diarmuradi.com" 
                required 
                autocomplete="email"
              >
              <span class="field-error" id="emailError"></span>
            </div>

            <!-- Password -->
            <div class="form-field">
              <label for="password">
                Password <span class="required">*</span>
              </label>
              <div class="password-group">
                <input 
                  type="password" 
                  id="password" 
                  name="password" 
                  placeholder="••••••••••" 
                  required 
                  autocomplete="new-password"
                >
                <button 
                  type="button" 
                  class="password-toggle" 
                  id="passwordToggle" 
                  aria-label="Show password"
                >
                  <!-- Eye Icon (visible by default) -->
                  <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                  <!-- Eye Off Icon (hidden by default) -->
                  <svg class="eye-off-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                    <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
                    <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
                    <line x1="2" x2="22" y1="2" y2="22" />
                  </svg>
                </button>
              </div>
              <span class="field-error" id="passwordError"></span>
            </div>

            <!-- Create Account Button -->
            <button type="submit" class="create-button" id="createAccountBtn">
              Create Account
            </button>
          </form>

          <!-- Footer Prompt -->
          <p class="login-text">
            Already have an account? 
            <button type="button" class="login-button" id="signInBtn">Sign in</button>
          </p>
        </div>

        <!-- Right Column: Desktop Testimonial (Hidden on mobile) -->
        <div class="testimonial">
          <div class="testimonial-content">
            <p class="testimonial-quote">
              &ldquo;Signing up took less than 30 seconds. I was 
              <span class="highlight">in my dashboard</span> 
              before my coffee even cooled down.&rdquo;
            </p>
            <div class="user-row">
              <div class="avatar">
                <img 
                  src="https://cdn.21st.dev/assets/localized/b881fc6e5d91d95f912abd2f45508332c7a398d9dd53c136c6c0a2d500c8fc7e.png" 
                  alt="Lee Robinson"
                  onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&h=120&q=80';"
                >
                <span class="avatar-fallback">L</span>
              </div>
              <div class="user-info">
                <p class="user-name">Lee Robinson</p>
                <p class="user-role">VP of DevRel</p>
              </div>
            </div>
          </div>
        </div>

      </section>
    </main>
  </div>

  <!-- JavaScript -->
  <script src="script.js"></script>
</body>
</html>
